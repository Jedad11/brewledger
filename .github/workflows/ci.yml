name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prisma validate/generate resolve env("DATABASE_URL") at parse time
      # even though neither connects to a database. A real connection string
      # is only needed for `migrate`/`db push`, which this workflow doesn't run.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/brewledger?schema=public"
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans full history (WBS 3.9), not just this diff — a
          # shallow checkout would only let it see the most recent commit.
          fetch-depth: 0

      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (per workspace)
        run: pnpm lint

      - name: Lint (RL-3 import boundary)
        run: pnpm lint:boundary

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Build
        run: pnpm build
