name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans full history (WBS 3.9), not just this diff — a
          # shallow checkout would only let it see the most recent commit.
          fetch-depth: 0

      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (per workspace)
        run: pnpm lint

      - name: Lint (RL-3 import boundary)
        run: pnpm lint:boundary

      - name: Lint (order status lifecycle guard, WBS 5.7)
        run: pnpm lint:lifecycle

      - name: Build
        run: pnpm build

      - name: Route bundle size (apps/shop /s/[slug], WBS 5.1 — 100 KB gzipped budget)
        run: node scripts/check-route-bundle-size.mjs

      - name: Forbidden-field scan (apps/shop built client bundle, WBS 5.1)
        run: node scripts/scan-forbidden-fields-bundle.mjs

      - name: Forbidden-field scan (committed snapshot fixtures, WBS 3.7)
        run: pnpm scan:forbidden-fields

      - name: Migration number collision / mirror check
        run: pnpm check:migration-numbers

      # `-r --if-present` skips workspaces with no "test" script (worker)
      # rather than erroring. apps/shop gained one in WBS 5.3
      # (storeSchedule.test.ts / copy.test.ts, pure functions, no Supabase
      # stack needed — these actually run and pass here, unlike the
      # infra-gated suites below). Every plain vitest suite that needs a
      # real local Supabase stack (packages/db/tests, packages/shared's
      # storage.test.ts, supabase/functions/_tests) SKIPS itself — not fails
      # — when that stack isn't reachable; this runner never starts one, so
      # those suites report "skipped" here. apps/console's
      # tests/e2e/otp-login.e2e.test.ts is a different case: a
      # Playwright-driven test against a live `next dev`/`next start` server
      # and real GoTrue that does NOT self-skip (it just times out) and is
      # separately rate-limited (5 logins/hour against the one seeded local
      # test_otp number) — unsuited to routine CI, by its own file header's
      # design ("run manually / by qa_engineer with the stack up"). Excluded
      # via apps/console's own package.json "test" script
      # (--exclude '**/*.e2e.test.ts'), not here, so `pnpm --filter
      # @brewledger/console test` behaves the same locally; that script also
      # adds "test:e2e" to still run it explicitly when the stack is up.
      - name: Test (per workspace, infra-gated suites self-skip)
        run: pnpm -r --if-present test
