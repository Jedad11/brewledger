services:
  - type: web
    name: brewledger-worker
    env: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter "@brewledger/worker..." build
    startCommand: node worker/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        sync: false
